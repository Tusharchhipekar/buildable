
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80 default_server;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 6000s;
    proxy_send_timeout 6000s;
    proxy_connect_timeout 6000s;

    # proxy_pass targets use variables, not bare hostnames — with a bare
    # hostname nginx resolves it once at startup and caches that IP for the
    # worker's lifetime, so restarting a backend container (which gets a new
    # IP) silently breaks routing until nginx itself restarts. Variables
    # force nginx to re-resolve through the `resolver` directive above,
    # honoring its `valid=10s` TTL.
    location /api/auth {
      set $upstream_auth auth:3000;
      proxy_pass http://$upstream_auth;
    }

    location /api/ai {
      set $upstream_ai ai-orchestration:3000;
      proxy_pass http://$upstream_ai;
    }

    location /api/sandbox {
      set $upstream_sandbox sandbox-server:3000;
      proxy_pass http://$upstream_sandbox;
    }
  }
  server {
    listen 80;
    server_name ~^(?<sandbox_id>.+)\.(?:preview|agent)\.localhost$;

    location / {
      set $upstream_router sandbox-router:3000;
      proxy_pass http://$upstream_router;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 6000s;
    }
  }
}
