apiVersion: apps/v1
kind: Deployment
metadata:
  name:  sandbox-deployment
  labels:
    name:  sandbox-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      serviceAccountName: resource-manager
      containers:
      - image:  sandbox:latest
        imagePullPolicy: IfNotPresent
        name:  main-sandbox-container
        resources:
          limits:
            cpu: "500m"
            memory: "400Mi"
          requests:
            cpu: "50m"
            memory: "200Mi"
        livenessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
          - name:  SANDBOX_PORT
            valueFrom:
              secretKeyRef:
                name:  port
                key:  SANDBOX_PORT
          - name:  SANDBOX_MONGO_URL
            valueFrom:
              secretKeyRef:
                name:  database
                key:  SANDBOX_MONGO_URL
          - name:  MONGO_URL
            valueFrom:
              secretKeyRef:
                name:  database
                key:  SANDBOX_MONGO_URL

          - name:  JWT_SECRET
            valueFrom:
              secretKeyRef:
                name:  jwt
                key:  JWT_SECRET
          - name:  REDIS_URL
            valueFrom:
              secretKeyRef:
                name:  database
                key:  REDIS_URL
          - name:  AWS_REGION
            valueFrom:
              secretKeyRef:
                name:  aws
                key:  AWS_REGION
          - name:  AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name:  aws
                key:  AWS_ACCESS_KEY_ID
          - name:  AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name:  aws
                key:  AWS_SECRET_ACCESS_KEY
          # Bun's fetch doesn't honor the k8s client-node lib's per-request
          # TLS agent, so it fails to verify the in-cluster apiserver's
          # certificate against the mounted service account CA. Safe here:
          # traffic never leaves the cluster-internal network.
          - name:  NODE_TLS_REJECT_UNAUTHORIZED
            value: "0"
        ports:
        - containerPort:  3000
          name:  main-sandbox
        