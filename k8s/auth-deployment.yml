apiVersion: apps/v1
kind: Deployment
metadata:
  name:  auth-deployment
  labels:
    app:  auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - image:  auth
        imagePullPolicy: IfNotPresent
        name:  auth-container
        resources:
          requests:
            cpu: "250m"
            memory: "128M"
          limits:
            cpu: "500m"
            memory: "256M"  
        livenessProbe:
          httpGet:
            path: /_status/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name:  MONGO_URL
          valueFrom:
            secretKeyRef:
              name: database
              key: AUTH_MONGO_URL
        
        - name:  RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: database
              key: RABBITMQ_URL      

        - name:  RABBITMQ_PORT
          valueFrom:
            secretKeyRef:
              name: database
              key: RABBITMQ_PORT     

        - name:  GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CLIENT_ID

        - name:  GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CLIENT_SECRET  

        - name:  JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt
              key: JWT_SECRET

        - name:  COOKIE_DOMAIN
          valueFrom:
            secretKeyRef:
              name: jwt
              key: COOKIE_DOMAIN

        - name:  AUTH_PORT
          valueFrom:
            secretKeyRef:
              name: port
              key: AUTH_PORT
              
        ports:
        - containerPort:  3000
          name:  auth-http
      